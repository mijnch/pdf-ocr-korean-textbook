# ═══════════════════════════════════════════════
#  PDF OCR 조정값
# ═══════════════════════════════════════════════
#
#  이 파일을 지워도 도구는 그대로 돌아갑니다(아래 값들이 기본값이라서).
#  값을 바꾸고 저장한 뒤 다시 실행하면 반영됩니다.
#  잘못된 값을 넣으면 그 항목만 무시하고 기본값으로 돌아가며 알려 줍니다.
#
#  각 값 옆의 설명은 '왜 그 숫자인지'입니다 — 5권 4,302쪽 실측으로 정한 값이라
#  근거 없이 바꾸면 품질이 나빠질 수 있습니다. 새 유형의 책에서 결과가
#  이상할 때 해당 항목만 조금씩 조정해 보세요.

[recognition]                  # 본문 인식
render_dpi = 200               # 기준 렌더 해상도. 300 이상은 Tesseract 레이아웃 분석이 흐트러짐
hires_max_dpi = 400            # 스캔 원본이 이보다 높아도 여기까지만 사용(그 위는 비용만 증가)
tess_lang = "kor+eng"          # 언어 데이터. 다른 언어를 쓰려면 tessdata에 추가 후 변경
min_line_conf = 35             # 줄 평균 신뢰도가 이보다 낮으면 잡음으로 버림
rescue_min_conf = 60           # 보충 줄(다른 PSM/해상도만 읽은 줄)의 더 엄격한 기준.
                               #   실측: 진짜 누락 본문 86~94, 오독 파편 36~39
rescue_min_wordish = 2         # 보충 줄 최소 실질 글자 수(쪽번호·기호 파편 배제)
page_ocr_timeout = 180         # 한 쪽 OCR 상한(초). 정상 1~3초 — 병적인 쪽만 끊음
mask_margin = 4                # 그림·수식을 가릴 때 사각형에 더하는 여백(픽셀)

[layout]                       # 영역 판정
imgsz = 896                    # 레이아웃 입력 크기. 1024 대비 약 1.15배 빠르고 검출 동등(실측)
conf = 0.2                     # 레이아웃 신뢰도 하한
header_band_ratio = 0.072      # 이 높이 안에 완전히 든 줄은 머리말로 버림.
                               #   실측: 머리말은 6.8%H에서 끝나고 본문은 7.3%H에서 시작
header_ext_ratio = 0.12        # 확장 띠. 이 안에서는 '쪽번호+장 표지' 형태만 추가로 버림
foot_band_ratio = 0.94         # 내장책 하단의 숫자만 있는 줄(쪽번호)을 버리는 경계
min_sane_char_ratio = 0.5      # 정상 글자 비율 하한. 내장 5권 실측 최저가 0.875라 여유가 큼
para_join_margin = 40          # 줄 끝이 본문 우측 끝에서 이 안쪽까지 차면 다음 줄과 한 문단
callout_color_ratio = 0.18     # 배경 유색 비율이 이보다 크면 강조/예제 박스로 봄
caption_max_chars = 45         # 캡션 표지가 없어도 이 길이 이하면 캡션 조각으로 봄

[figure]                       # 그림 저장
margin = 6                     # 잘라낼 때 사방 여백(픽셀)
max_px = 2000                  # 최장변 상한. 초과분은 축소(화면·인쇄에 충분)
colors = 256                   # 양자화 색 수. 선화·회로도는 무손실급이며 용량이 약 절반

[formula]                      # 수식 인식
mfd_resized_shape = 1024       # 수식 검출 입력 크기(작고 빽빽한 전공서 기준)
mfr_batch_size = 8             # 배치 크기. 16·32는 실측에서 오히려 손해였음
min_mfr_score = 0.35           # 이보다 낮으면 그림 오인으로 버림(정상 수식은 0.7 이상)
mfr_max_tokens = 768           # 생성 상한. 최장 정상 수식이 약 450토큰
retry_pad = 6                  # 반복 루프 출력일 때 크롭을 넓혀 1회 재인식할 여백

[table]                        # 표 추출
ink_thr = 200                  # 잉크 판정 밝기. 교과서 괘선은 회색이라 150이면 놓침
h_line_ink = 0.55              # 가로 괘선: 잉크가 폭의 이 비율 이상인 행
v_line_ink = 0.50              # 세로 괘선: 잉크가 높이의 이 비율 이상인 열
min_fill = 0.5                 # 내용이 있는 셀 비율 하한
max_cell_chars = 90            # 셀이 이보다 길면 행 분할 실패(문단 뭉개짐)로 보고 포기
min_col_fill = 0.3             # 채움이 이보다 낮은 열은 유령 열로 보고 왼쪽에 병합
max_junk_ratio = 0.2           # 깨진 셀 비율이 이를 넘으면 표를 포기
max_eq_ratio = 0.15            # 등호 셀 비율이 이를 넘으면 수식 표로 보고 PNG로만 남김
scan_cell_min_conf = 80        # 스캔 표 셀: 두 배율 인식이 모두 이 신뢰도 이상이어야 채택.
                               #   낮추면 위첨자(10^6 등) 오독이 표에 섞일 위험이 커짐
