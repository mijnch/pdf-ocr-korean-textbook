# ═══════════════════════════════════════════════
#  장 구분 프로파일 — 예시
# ═══════════════════════════════════════════════
#
#  이 파일을 "장구분.toml"로 복사해 쓰는 책에 맞게 고치세요.
#  (실제 사용하는 프로파일은 저장소에 포함하지 않습니다.)
#
#  변환할 때 '## N페이지' 절 바로 앞에 장 제목을 넣습니다.
#  name 은 PDF 파일 이름(확장자 제외)과 정확히 같아야 합니다.
#  page 는 PDF 기준 쪽(인쇄된 쪽번호가 아님)입니다.
#  이 파일이 없거나 해당 책이 없으면 장 헤딩 없이 그대로 변환합니다.
#  변환이 끝나면 각 장 제목이 그 쪽 근처(±3쪽) 본문에 실제로 있는지 확인해
#  어긋난 앵커를 알려 줍니다.
#
#  장 감지를 파이프라인에 넣지 않고 데이터로 두는 이유:
#  장 표기법이 책마다 이질적이라('제1장', 'Chapter 1', '1장', 색 밴드 안의
#  큰 숫자) 자동 감지는 어느 책에서든 조용히 틀린다. 확인된 결과를
#  데이터로 두는 편이 검증 가능하고 새 책 추가도 쉽다.

[[book]]
name = "예시교재"
chapters = [
  { page = 12, title = "제1장 서론" },
  { page = 40, title = "제2장 기본 개념" },
  { page = 88, title = "제3장 응용" },
]

# 내장 텍스트 레이어가 망가진 책은 도구가 스스로 알아내 스캔 경로로 돌립니다
# (표본 12쪽에서 텍스트층과 Tesseract 판독을 맞대어 75% 미만이면 전환).
# 그 판정을 사람이 덮어써야 할 때만 아래처럼 force_scan 을 적습니다.
[[book]]
name = "예시교재_저품질레이어"
force_scan = true
chapters = [
  { page = 20, title = "제1장 개요" },
]
