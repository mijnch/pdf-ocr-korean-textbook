name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read        # 저장소를 읽기만 한다 — GITHUB_TOKEN 을 쓰기 권한 없이 발급받는다

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}   # 같은 브랜치에 연달아 푸시하면 앞 실행을 취소한다
  cancel-in-progress: true

jobs:
  golden:
    # 이 도구는 Windows 전용(DirectML·Tesseract 경로)이므로 실제 대상 플랫폼·버전에서 검증한다.
    runs-on: windows-latest
    timeout-minutes: 20   # 실제 실행은 1~2분. 러너가 멈춰도 기본값(6시간)까지 돌지 않게 한다

    # pwsh(PowerShell 7)는 스크립트를 UTF-8로 읽는다. Windows PowerShell 5.1이나
    # cmd 는 한글이 든 파일 이름을 깨뜨리므로 여기서는 쓰지 않는다.
    defaults:
      run:
        shell: pwsh

    env:
      PYTHONUTF8: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: 고정한 의존성이 이 플랫폼에서 설치 가능한지
        # 메타데이터만 받아 풀어 본다 — 휠이 없거나 버전이 빠졌으면 여기서 실패한다.
        # ':all: ' 의 콜론+공백을 YAML 이 키로 읽으므로 블록 문자열로 쓴다.
        run: |
          python -m pip install --dry-run --ignore-installed --only-binary=:all: -r scripts/requirements.txt

      - name: 골든 테스트
        # 모델·Tesseract 없이 수식 정리·머리말 판정·표 격자·쪽번호 확정·줄바꿈 이음·
        # 이어 쓰기를 확인한다. 개인 장 구분 프로파일(장구분.toml)이 필요한 2건은
        # 공개 저장소에 그 파일이 없으므로 건너뛴다.
        run: |
          python -m pip install --quiet pillow==12.2.0 numpy==2.5.0
          python scripts/tests/test_pure.py

      - name: 소스 구문 검사
        run: python -m compileall -q scripts
